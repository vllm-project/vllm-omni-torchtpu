# Nightly vllm-omni-torchtpu image. Uploaded by the main-branch step of
# .buildkite/release/pipeline.yml (the vllm-omni-torchtpu-release pipeline's
# daily schedule), so it runs on the release queue, the only agent that can
# read the Docker Hub token. See .buildkite/release/README.md.
#
# Builds docker/Dockerfile --target dev on vllm/vllm-torchtpu:nightly (pinned
# by digest at build time), pushes it to GAR as nightly-YYYYMMDD and latest,
# and to Docker Hub as nightly-YYYYMMDD-<commit>-<vllm> and nightly.

steps:
  - label: ":docker: Nightly omni image (GAR, and Docker Hub nightly)"
    key: nightly_images
    if: build.branch == "main"
    agents:
      queue: release-vllm-torchtpu
    timeout_in_minutes: 180
    env:
      PUBLISH_DOCKERHUB: "1"
      DOCKERHUB_REPO: "vllm/vllm-omni-torchtpu"
      DOCKERHUB_USERNAME: "vllm"
    secrets:
      - DOCKERHUB_TOKEN_VLLM_OMNI_TORCHTPU
    commands:
      - bash .buildkite/scripts/publish_nightly_images.sh
