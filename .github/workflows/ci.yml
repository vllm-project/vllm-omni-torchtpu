# Static lint and wheel/sdist checks on ubuntu-latest.
# Note: CPU pytest execution is intentionally omitted until `tests_omni` guards
# its autouse `_sync_tpu` TPU synchronize fixture and tags TPU-only tests, so
# static PR checks stay fast without pulling the full runtime/git stack.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit and ruff
        run: python -m pip install pre-commit ruff==0.14.0
      - name: Run ruff check and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Run twine metadata check
        run: |
          python -m pip install twine
          twine check --strict dist/*
      - name: Verify wheel contents and entry points
        run: |
          python - <<'PY'
          import configparser
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected 1 wheel, got {wheels}"

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              assert any(
                  n.startswith("vllm_omni_torchtpu/patches/") and n.endswith(".py")
                  for n in names
              ), f"Missing patches/ modules in wheel: {names}"
              assert any(
                  n.startswith("vllm_omni_torchtpu/worker/") and n.endswith(".py")
                  for n in names
              ), f"Missing worker/ modules in wheel: {names}"

              ep_files = [n for n in names if n.endswith(".dist-info/entry_points.txt")]
              assert len(ep_files) == 1, f"Expected 1 entry_points.txt, got {ep_files}"
              cp = configparser.ConfigParser()
              cp.read_string(zf.read(ep_files[0]).decode("utf-8"))
              assert dict(cp["vllm_omni.platform_plugins"]) == {
                  "torchtpu_omni": "vllm_omni_torchtpu:register_omni_tpu_platform"
              }
              assert dict(cp["vllm.platform_plugins"]) == {
                  "torchtpu_omni": "vllm_omni_torchtpu:register_tpu_platform_alias"
              }
          print(f"Verified wheel {wheels[0]} ({len(names)} entries)")
          PY
