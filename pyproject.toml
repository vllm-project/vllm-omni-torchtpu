[build-system]
requires = ["setuptools>=77.0.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-omni-torchtpu"
dynamic = ["version"]
description = "vLLM-Omni platform plugin for Google Cloud TPU"
readme = "README.md"
# 3.12 only: torch_tpu, libtpu, and vllm-torchtpu wheels are cp312-only, so any
# other interpreter fails to resolve. Stating it here makes that an up-front
# error rather than an unsatisfiable-requirements failure during a build.
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "vLLM TorchTPU Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Floor at the newest PyPI release so a plain install resolves without
    # version overrides. TPUARWorker (Qwen3-Omni AR stages) also needs
    # TPUWorker.model_runner_cls from vllm-torchtpu#2065, newer than 0.33.0,
    # and raises an ImportError without it. Until a >=0.34.0 core wheel is on
    # PyPI, CI and TPU runs add `--group core-git` (see README).
    "vllm-torchtpu-core>=0.33.0",
    # vLLM-Omni dependency. vllm-omni keeps major.minor aligned with vLLM, so
    # bump this pin together with the vLLM pin in the `vllm` dependency group.
    "vllm-omni==0.33.0rc1",
    # vllm-omni pulls torchaudio through s3tokenizer. The PyPI torchaudio is a
    # CUDA build that fails to load libcudart, and transformers imports
    # torchaudio whenever it is installed, so every vLLM import would fail.
    # Take the CPU build instead (see [tool.uv.sources]). 2.11.0 is the newest
    # torchaudio release; it declares no torch requirement and imports against
    # torch 2.13.0.
    "torchaudio==2.11.0",
]

# Plugin coexistence with vllm-torchtpu-core <= 0.33.x, which still registers its
# own `torchtpu` entry under `vllm_omni.platform_plugins` alongside `torchtpu`
# under `vllm.platform_plugins`. Both vLLM and vllm-omni filter every plugin
# group by entry-point name via `VLLM_PLUGINS`, and raise RuntimeError if two
# out-of-tree platform plugins activate in the same group. `register_tpu_platform_alias`
# returns None when `VLLM_PLUGINS` is unset (leaving plain vLLM working via core's
# `torchtpu` entry) and delegates to `register_tpu_platform` when `VLLM_PLUGINS`
# selects `torchtpu_omni`.
# Separate vLLM-Omni plugin groups: `vllm_omni.platform_plugins` selects the
# platform when `current_omni_platform` is first resolved;
# `vllm_omni.general_plugins` runs after imports and before the engine starts
# its warmup.
[project.entry-points."vllm_omni.platform_plugins"]
torchtpu_omni = "vllm_omni_torchtpu:register_omni_tpu_platform"

[project.entry-points."vllm_omni.general_plugins"]
torchtpu_omni = "vllm_omni_torchtpu:register_omni_general_plugins"

[project.entry-points."vllm.platform_plugins"]
torchtpu_omni = "vllm_omni_torchtpu:register_tpu_platform_alias"

# Dev / CI / Docker only. These are PEP 735 dependency groups, not extras:
# groups are never written into the built wheel's metadata, so their git URLs
# do not block a PyPI upload (PyPI rejects direct-URL requirements, even in
# extras). Install with `--group <name>` (uv, or pip >= 25.1).
[dependency-groups]
# The omni code cut at a0275aad4f81a8befa40f8dc7a3fbeebaaff4355 needs
# vllm-torchtpu-core changes newer than the 0.33.0 release (vllm-torchtpu#2065
# and #3304, including TPUWorker.model_runner_cls and the guarded worker_cls
# default in TpuPlatform). uv builds this commit without release tags, so
# setuptools-scm stamps a version below the >=0.33.0 floor; set
# SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VLLM_TORCHTPU_CORE=0.34.0.dev0 when
# installing this group.
core-git = [
    "vllm-torchtpu-core @ git+https://github.com/vllm-project/vllm-torchtpu.git@a0275aad4f81a8befa40f8dc7a3fbeebaaff4355",
]

# vLLM built from source. Deliberately NOT in `dependencies`: the combined
# `vllm-torchtpu` wheel already provides vLLM, and installing the real `vllm`
# on top would overwrite it. Opt in with `pip install -e . --group vllm`.
vllm = [
    # Note: we **intentionally** build vllm from source, see README.
    "vllm @ git+https://github.com/vllm-project/vllm.git@v0.33.0",
]

# Required for running tests
test = [
    "absl-py",
    "pytest",
    "pytest-mock",
    "pytest-timeout",
    "pytest-cov",
    "parameterized",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "tpu_test: tests that require TPU hardware; CI runs them on a single-host TPU agent",
    "nightly: tests that only run in the nightly CI workflow",
    "multichip: tests that need more than 2 TPU chips; CI runs them on an 8-chip agent",
    "spawns_tpu_workers: tests that spawn a torch.distributed.run worker group spanning the TPU slice; must run before any in-process TPU test in the same pytest session",
]

[tool.ruff]
# Without this, ruff ignores its `exclude` lists for any path named directly
# on the command line, which is exactly how pre-commit invokes it. Setting it
# makes `exclude` hold for both `ruff format .` and the hook.
force-exclude = true

[tool.ruff.lint]
# E pycodestyle, F pyflakes, I import sorting, UP outdated syntax, B likely
# bugs, SIM needless complexity, G logging calls, ISC string concatenation,
# T20 print calls, S110 `except: pass`.
# E501 fails a line longer than 88 characters, the width `ruff format` wraps
# code at. The formatter does not split comments or strings, so wrap those by
# hand.
select = ["E", "F", "I", "UP", "B", "SIM", "G", "ISC", "T20", "S110"]

ignore = [
    # Off on purpose, matching upstream vllm.
    "B905",   # zip() without an explicit strict=
    "B007",   # loop control variable not used in the body
    "UP032",  # .format() that could be an f-string
]

[tool.ruff.lint.isort]
known-first-party = ["vllm_omni_torchtpu", "tests"]

[tool.ruff.lint.per-file-ignores]
# Library code logs through vllm_torchtpu.logger. Tests, scripts and
# command-line tools print to the terminal on purpose.
"!src/**" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_omni_torchtpu*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

# Default PyPI serves Linux x86_64 wheels of torch and torchvision built with
# CUDA, which pulls gigabytes of unnecessary nvidia-* runtime dependencies onto
# TPU hosts. Pin them to the official PyTorch CPU index while resolving all
# other packages (including torch-tpu, libtpu, and tpu-sync-torch) from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
